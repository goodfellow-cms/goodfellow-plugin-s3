# Keeps the actions this repository's workflows use, each pinned to a commit, and its packages up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Its packages. Security updates come as they're published; the rest once a week, together.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      packages:
        patterns: ["*"]
