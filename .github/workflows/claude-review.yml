# Claude reviews a pull request with Claude Code's /code-review, and what it finds is posted as comments on the lines.
#
# - Once CI has passed: CI's claude-review job calls this after its other jobs succeed, the first time they do
#   on a pull request that's ready for review, and only for the commit whose CI passed. It then labels the pull
#   request claude-reviewed, so later pushes aren't reviewed again by themselves.
# - On request: a comment whose first line is `/claude-review` reviews the pull request as it is now
#   (`/claude-review high` at that level, for that review only). So does adding the claude-review label, which is
#   taken off again afterwards, ready to add another time.
# - Levels: claude-review:low, :high, or :xhigh on the pull request sets the level of every review of it, which is
#   medium otherwise, and no-claude-review skips the review CI would start.
#
# Every review runs the pull request's own copy of this workflow, which gets this repository's secrets only for a
# branch here, whose author can already push here: a label's run is the pull request's own, and a comment's run
# (claude-review-request.yml, the main branch's) only checks the request and starts the pull request's own copy with
# workflow_dispatch, never reading its code. This file has no comment trigger, so nothing here runs with the main
# branch's rights over the pull request's code. Only pull requests from branches here are reviewed, and only someone who can push here starts a
# review, since each one uses the subscription.
#
# Each review keeps one comment up to date: that Claude is reviewing a commit, then what it found or why it
# couldn't, and what it used. That comment carries the review's commit and how it went, which review-status.yml
# reads to set the "Claude reviewed" status, so it's refreshed once a review ends.
#
# It runs on the Claude subscription of whoever made the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`),
# and does nothing until there is one. It reads the pull request and runs none of its code: Claude Code loads only
# the runner's settings, never the pull request's .claude/ settings and their hooks, and runs in a job of its own that
# can only read. It answers with its findings as data (structured output), which the finish job posts on the pull
# request it chose, so every way a review starts publishes the same way. Pull requests from
# forks are never reviewed, since GitHub gives their runs no secrets. A review that fails, such as when the plan's
# limit is reached, never fails CI; the "Claude reviewed" status says so instead.
name: Claude review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
  pull_request:
    types: [labeled]
  # How a comment's request (claude-review-request.yml) starts the pull request's own copy, and how someone who can
  # push can ask from the Actions tab.
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request's number
        required: true
        type: string
      level:
        description: low, medium, high, or xhigh, for this review only
        required: false
        type: string

permissions: {}

env:
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number || inputs.pr }}

jobs:
  choose:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
        && ((github.event.action == 'labeled'
            && (github.event.label.name == 'claude-review' || startsWith(github.event.label.name, 'claude-review:')))
          || (github.event.action != 'labeled'
            && !github.event.pull_request.draft
            && !contains(github.event.pull_request.labels.*.name, 'no-claude-review')
            && !contains(github.event.pull_request.labels.*.name, 'claude-reviewed'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      run: ${{ steps.choose.outputs.run }}
      level: ${{ steps.choose.outputs.level }}
      sha: ${{ steps.choose.outputs.sha }}
      base: ${{ steps.choose.outputs.base }}
      comment: ${{ steps.comment.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
    # Nothing here fails CI: a step that can't finish leaves no review to run, or no comment to update.
    steps:
      - name: Choose what to review
        id: choose
        continue-on-error: true
        timeout-minutes: 2
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          ADDED: ${{ github.event.label.name }}
          EVENT: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.event.sender.login }}
          ASKED: ${{ inputs.level }}
        run: |
          skip() { echo "::notice::$1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # One whole level, never part of a label's name.
          is_level() { case "$1" in low | medium | high | xhigh) return 0 ;; *) return 1 ;; esac; }
          if [ "$HAS_TOKEN" != "true" ]; then skip "No CLAUDE_CODE_OAUTH_TOKEN secret, so no review."; fi
          if [ "$EVENT_ACTION" = "labeled" ] && [ "$ADDED" != "claude-review" ] && ! is_level "${ADDED#claude-review:}"; then
            skip "$ADDED isn't a level, so it starts no review."
          fi
          if [ -n "$ASKED" ] && ! is_level "$ASKED"; then skip "$ASKED isn't a level."; fi
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then skip "$PR isn't a pull request's number."; fi
          # Claude Code's action refuses a run a bot started, such as CI for a push by Renovate; asking by comment
          # still reviews it, as that run is started by this workflow's own bot, which the review step allows.
          if [ "$EVENT" != "workflow_dispatch" ] && [[ "$ACTOR" == *"[bot]" ]]; then
            skip "$ACTOR started this, and Claude Code's action doesn't run for bots. Comment /claude-review to ask."
          fi
          # Anyone who can add a label can start a run, but only someone who can push starts a review. A dispatch
          # needs push access already.
          if [ "$EVENT_ACTION" = "labeled" ]; then
            permission=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission) || permission=none
            case "$permission" in admin | maintain | write) ;; *) skip "$ACTOR can't push here, so they can't start a review." ;; esac
          fi
          pr=$(gh pr view "$PR" --json headRefOid,headRefName,baseRefName,labels,isCrossRepository,state) ||
            skip "Couldn't read the pull request, so no review."
          if jq -e '.isCrossRepository or .state != "OPEN"' <<<"$pr" > /dev/null; then
            skip "Only open pull requests from branches here are reviewed."
          fi
          head=$(jq -r .headRefOid <<<"$pr")
          # The branch it's merged into, from which the review works out where its change starts.
          base=$(jq -r .baseRefName <<<"$pr")
          if ! [[ "$base" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$base" == *..* ]]; then skip "Couldn't read the branch it's merged into."; fi
          # A dispatch reviews only with the pull request's own copy of this workflow.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$(jq -r .headRefName <<<"$pr")" != "$GITHUB_REF_NAME" ]; then
            skip "Run this on the pull request's own branch, $(jq -r .headRefName <<<"$pr")."
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$EVENT_ACTION" != "labeled" ]; then
            # CI passed for this run's commit; a newer one is reviewed, if at all, once its own CI passes.
            if [ "$head" != "$EVENT_SHA" ]; then skip "The pull request has moved on from the commit whose CI passed."; fi
            # The event's labels are as they were when it fired: a review that ran meanwhile, such as for an earlier
            # push, may have labelled the pull request since.
            if jq -e '[.labels[].name] | any(. == "claude-reviewed" or . == "no-claude-review")' <<<"$pr" > /dev/null; then
              skip "Already reviewed, or not to be reviewed by itself."
            fi
          fi
          level=medium
          levels=$(jq -r '.labels[].name | select(test("^claude-review:(low|medium|high|xhigh)$"))' <<<"$pr")
          # With several level labels, such as one added by someone who can't push, which no review then tidied, the
          # one added last counts, as the clean-up after a review keeps it; by event id, which only grows.
          if [ "$(grep -c . <<<"$levels")" -gt 1 ]; then
            newest=$(gh api --paginate "repos/$GH_REPO/issues/$PR/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" and .actor.login != "github-actions[bot]") | "\(.id) \(.label.name)"' |
              sort -n | sed 's/^[0-9]* //' | grep -Fxf <(printf '%s\n' "$levels") | tail -n 1) || newest=""
            levels=${newest:-$(head -n 1 <<<"$levels")}
          fi
          # A level label on the pull request, then the one just added, then a level asked for, which wins.
          while IFS= read -r label; do
            case "$label" in claude-review:*) is_level "${label#claude-review:}" && level=${label#claude-review:} ;; esac
          done < <(printf '%s\n' "$levels" "$ADDED")
          if [ -n "$ASKED" ]; then level=$ASKED; fi
          {
            echo "run=true"
            echo "level=$level"
            echo "sha=$head"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

      # The review's own comment, which says what's happening until it ends.
      - name: Say Claude is reviewing
        id: comment
        if: steps.choose.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          LEVEL: ${{ steps.choose.outputs.level }}
          SHA: ${{ steps.choose.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '<!-- claude-review sha=%s outcome=reviewing -->\nClaude is reviewing %s at **%s** ([the run](%s)).\n' \
            "$SHA" "${SHA:0:7}" "$LEVEL" "$RUN_URL")
          id=$(gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -f body="$body" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  review:
    needs: choose
    # Only a review with its own comment runs, since the comment is where its outcome goes: without one, the request
    # stays as it was, for another try.
    if: needs.choose.outputs.run == 'true' && needs.choose.outputs.comment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only what reading needs: Claude runs with this job's token, and the finish job posts what it found.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
    outputs:
      outcome: ${{ steps.claude.outcome }}
      findings: ${{ steps.claude.outputs.structured_output }}
      skipped: ${{ steps.still.outputs.skipped }}
      usage: ${{ steps.usage.outputs.text }}
    steps:
      # Reviews of one pull request wait their turn here, one at a time: GitHub drops a waiting review when a newer
      # one joins the queue, and its finish says so (outcome=replaced). CI's review checks again, once its turn
      # comes, that no review that ran meanwhile has made it unneeded: one whose finish has labelled the pull request, or one that
      # started before this one and still says it's reviewing, since its finish labels it only once this slot is free.
      # Each review's comment is posted as it's chosen, so an earlier comment is an earlier review.
      - name: Check it's still wanted
        id: still
        if: github.event_name == 'pull_request' && github.event.action != 'labeled'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          OWN: ${{ needs.choose.outputs.comment }}
        run: |
          unneeded() { echo "::notice::$1"; echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # A lookup that fails fails the step, which stops the review: it may have been labelled not to run.
          labelled=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | any(. == "claude-reviewed" or . == "no-claude-review")')
          if [ "$labelled" = true ]; then
            unneeded "Reviewed meanwhile, or no longer to be reviewed by itself."
          fi
          if [[ "$OWN" =~ ^[0-9]+$ ]]; then
            # Only the last two hours': the status counts a review still "reviewing" after that as not finished.
            since=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            earlier=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments?since=$since&per_page=100" --jq '.[]
              | select(.user.login == "github-actions[bot]" and .id < (env.OWN | tonumber)
                and (.body | startswith("<!-- claude-review ") and (split("\n")[0] | contains(" outcome=reviewing "))))
              | .id')
            if [ -n "$earlier" ]; then unneeded "A review that started earlier is finishing."; fi
          fi

      # A review that fails says so in its comment and the "Claude reviewed" status, never by failing CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        # Not after a failed check (which a labelled request, skipping it, never is).
        if: steps.still.outcome != 'failure' && steps.still.outputs.skipped != 'true'
        continue-on-error: true
        timeout-minutes: 5
        with:
          ref: ${{ needs.choose.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The review reads the change from the commit it was chosen for, never the pull request's live diff, which may
      # have moved on while it waited, so what it finds is about the commit its comments go on.
      - name: Find where the change starts
        id: base
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          BASE: ${{ needs.choose.outputs.base }}
        # On its own line, so a merge base that can't be found fails the step, which the review waits on.
        run: |
          base=$(git merge-base "refs/remotes/origin/$BASE" HEAD)
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # A step that runs out of time fails, which continue-on-error catches; the job running out would be cancelled,
      # failing CI, so the review stops well before the job's own limit.
      - name: Review
        id: claude
        if: steps.base.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 35
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Asked in words rather than as the slash command itself: a slash command's skill ends the session when it's
          # done, before Claude can return its findings as the schema asks, so the review would come back empty.
          prompt: >-
            Review pull request #${{ env.PR }} with the code-review skill at the ${{ needs.choose.outputs.level }}
            level, as `/code-review ${{ needs.choose.outputs.level }} ${{ env.PR }}` would, but at the commit it was
            chosen for, ${{ needs.choose.outputs.sha }}, which this checkout is at: read the change with
            `git diff ${{ steps.base.outputs.sha }} HEAD`, never `gh pr diff`, since the pull request may have moved on
            since. Its lines are the lines of the files in this checkout. Once it's done, return every
            finding it reports as the structured output, each with the file and line it names, or no findings if it
            raised none.
          # A comment's request is dispatched with this repository's token, so its run is started by
          # github-actions[bot], which the action refuses unless it's named here. No other bot is, and nothing else
          # starts these runs as one.
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && 'github-actions[bot]' || '' }}
          # Only what reading needs: no editing, and no commands but reading the pull request and git. Only the
          # runner's own settings, never the checkout's .claude/ ones, whose hooks would run the pull request's own
          # commands with this job's token. Findings come back as data, in the schema below, for the finish job.
          claude_args: >-
            --model opus
            --setting-sources user
            --allowedTools "Skill,Agent,Read,Glob,Grep,Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["findings"],"properties":{"findings":{"type":"array","description":"Every finding of the review, none when it found nothing to raise","items":{"type":"object","additionalProperties":false,"required":["path","line","body"],"properties":{"path":{"type":"string","description":"The file the finding is about, relative to the root of the repository"},"line":{"type":"integer","minimum":1,"description":"The line it is about, in the version of the file in the pull request"},"body":{"type":"string","description":"The finding in Markdown: what is wrong, how it fails, and the fix"}}}}}}'

      - name: Count what it used
        id: usage
        if: always() && steps.still.outputs.skipped != 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          result='{}'
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            result=$(jq -c '[.[] | select(.type == "result")] | last // {}' "$EXECUTION_FILE" 2> /dev/null) || result='{}'
          fi
          # Tokens across every model the review used, its subagents' included, and Claude Code's estimate of what
          # they'd cost at API prices, which compares reviews with each other; on a subscription, nothing is billed.
          text=$(jq -r '
            (.modelUsage // {}) as $m
            | if ($m | length) == 0 then "Claude Code reported no usage."
              else
                ([$m[] | (.inputTokens // 0) + (.cacheReadInputTokens // 0) + (.cacheCreationInputTokens // 0)] | add) as $in
                | ([$m[] | .outputTokens // 0] | add) as $out
                | "\($in) tokens read, \($out) written, by \($m | keys | join(", ")); about $\(.total_cost_usd // 0 | . * 100 | round / 100) at API prices; \(.num_turns // 0) turns in \((.duration_ms // 0) / 60000 | round) min."
              end
            # The tools it was refused, by name only (never what it asked them), so a review that could not finish
            # says why.
            + ([.permission_denials // [] | .[] | .tool_name // empty | tostring | gsub("[^A-Za-z0-9_:().*-]"; "")]
              | unique | if length > 0 then " Refused: \(join(", "))." else "" end)' <<<"$result" 2> /dev/null) || text="Claude Code reported no usage."
          echo "text=$text" >> "$GITHUB_OUTPUT"

  finish:
    needs: [choose, review]
    if: always() && needs.choose.outputs.run == 'true' && needs.choose.outputs.comment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    # Every step runs whatever the one before did, and none fails CI, so the comment and the status always say how
    # the review went.
    steps:
      # A review GitHub dropped while it waited, because a newer one joined the queue, ran no step at all, unlike
      # one cancelled once it had started. Where the run's jobs can't be read, it counts as one that didn't finish.
      - name: Check whether it ever started
        id: started
        if: always() && needs.review.result == 'cancelled'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          steps=$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "review" or (.name | endswith(" / review"))) | .steps | length')
          if [ "$steps" = 0 ]; then echo "replaced=true" >> "$GITHUB_OUTPUT"; fi

      # What Claude found goes on the lines it's about in the reviewed commit, or on the file where the line isn't
      # part of the change; anything GitHub refuses on both (422) is about a line outside the change, and anything it
      # didn't take for another reason, even after waiting once, is listed apart in the review's comment.
      - name: Post what it found
        id: post
        if: always() && needs.review.outputs.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          FINDINGS: ${{ needs.review.outputs.findings }}
          SHA: ${{ needs.choose.outputs.sha }}
        run: |
          if ! jq -e '.findings | type == "array"' <<<"$FINDINGS" > /dev/null 2>&1; then
            echo "::warning::The review gave no findings to post."
            exit 0
          fi
          # Posts a comment on the change, printing what GitHub said only when it refused.
          post() { gh api --method POST "repos/$GH_REPO/pulls/$PR/comments" -f commit_id="$SHA" "$@" 2>&1 > /dev/null; }
          # A finding as an item of a Markdown list, its later lines indented so they stay in the item.
          item() { printf -- '- `%s:%s`: %s\n' "$1" "$2" "$(sed '2,$s/^/  /' <<<"$3")"; }
          : > "$RUNNER_TEMP/elsewhere.md"
          : > "$RUNNER_TEMP/unposted.md"
          while IFS= read -r finding; do
            path=$(jq -r .path <<<"$finding")
            line=$(jq -r .line <<<"$finding")
            body=$(jq -r .body <<<"$finding")
            on_line() { post -f body="$body" -f path="$path" -F line="$line" -f side=RIGHT; }
            if err=$(on_line); then continue; fi
            # Anything but GitHub saying the line isn't in the change, such as its secondary rate limit, gets one more go.
            if [[ $err != *"HTTP 422"* ]]; then
              sleep 10
              if err=$(on_line); then continue; fi
            fi
            if [[ $err == *"HTTP 422"* ]]; then
              if err=$(post -f body="$(printf 'Line %s: %s' "$line" "$body")" -f path="$path" -f subject_type=file); then
                continue
              fi
            fi
            if [[ $err == *"HTTP 422"* ]]; then
              item "$path" "$line" "$body" >> "$RUNNER_TEMP/elsewhere.md"
            else
              echo "::warning::GitHub didn't take a finding on $path:$line: $err"
              item "$path" "$line" "$body" >> "$RUNNER_TEMP/unposted.md"
            fi
          done < <(jq -c '.findings[] | select(type == "object" and (.path | type) == "string" and (.line | type) == "number" and (.body | type) == "string")' <<<"$FINDINGS")
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Remember the review
        if: always() && steps.post.outputs.done == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          gh label create claude-reviewed --color ededed --description "Claude has reviewed it; comment /claude-review for another review" 2> /dev/null || true
          gh pr edit "$PR" --add-label claude-reviewed

      # The plain request comes off, ready to add again. Of the level labels, the one added last stays, read from the
      # pull request's history, so reviews that end in any order leave the same one.
      - name: Take the request off
        if: always() && github.event.action == 'labeled'
        continue-on-error: true
        timeout-minutes: 2
        env:
          ADDED: ${{ github.event.label.name }}
        run: |
          # When people added each request label, by event id, which only grows. Labels this workflow put back are
          # left out, so putting one back never makes it a newer request than one someone added since.
          labeled() {
            gh api --paginate "repos/$GH_REPO/issues/$PR/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" and (.label.name | startswith("claude-review")) and .actor.login != "github-actions[bot]") | "\(.id) \(.label.name)"'
          }
          history=$(labeled)
          seen=$(awk '$1 > max { max = $1 } END { print max + 0 }' <<<"$history")
          # Whether someone added the label again after the history above was read.
          readded() {
            local recent
            recent=$(labeled) || return 0
            awk -v seen="$seen" -v name="$1" '$1 > seen + 0 && substr($0, index($0, " ") + 1) == name { found = 1 } END { exit !found }' <<<"$recent"
          }
          # A label added again since is a new request, so it stays, as does one whose history can't be read again.
          # GitHub can't take a label off only if it's unchanged, so one added again just before it comes off is
          # put back.
          remove() {
            if readded "$1"; then echo "::notice::$1 was added again meanwhile, or couldn't be checked, so it stays."; return; fi
            gh pr edit "$PR" --remove-label "$1"
            if readded "$1"; then
              echo "::notice::$1 was added again as it came off, so it goes back."
              gh pr edit "$PR" --add-label "$1"
            fi
          }
          if [ "$ADDED" = "claude-review" ]; then remove claude-review; fi
          levels=$(gh pr view "$PR" --json labels --jq '.labels[].name | select(test("^claude-review:(low|medium|high|xhigh)$"))')
          # The last added of those on the pull request now, so one taken off by hand since never counts.
          newest=$(sort -n <<<"$history" | sed 's/^[0-9]* //' | grep -Fxf <(printf '%s\n' "$levels") | tail -n 1 || true)
          while IFS= read -r label; do
            if [ -n "$label" ] && [ -n "$newest" ] && [ "$label" != "$newest" ]; then remove "$label"; fi
          done <<<"$levels"

      # A review that turned out to be unneeded takes its comment away again.
      - name: Take the comment back
        if: always() && needs.review.outputs.skipped == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          COMMENT: ${{ needs.choose.outputs.comment }}
        run: gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT"

      - name: Say how it went
        if: always() && needs.review.outputs.skipped != 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          RESULT: ${{ needs.review.result }}
          REPLACED: ${{ steps.started.outputs.replaced }}
          OUTCOME: ${{ needs.review.outputs.outcome }}
          POSTED: ${{ steps.post.outputs.done }}
          USAGE: ${{ needs.review.outputs.usage }}
          LEVEL: ${{ needs.choose.outputs.level }}
          SHA: ${{ needs.choose.outputs.sha }}
          COMMENT: ${{ needs.choose.outputs.comment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Lengths in characters, as GitHub counts them, not bytes.
          export LC_ALL=C.UTF-8
          short=${SHA:0:7}
          elsewhere=$(cat "$RUNNER_TEMP/elsewhere.md" 2> /dev/null || true)
          unposted=$(cat "$RUNNER_TEMP/unposted.md" 2> /dev/null || true)
          if [ "$RESULT" = success ] && [ "$OUTCOME" = success ] && [ "$POSTED" = true ] && [ -n "$elsewhere$unposted" ]; then
            # Findings no comment on the change holds, which the status counts against the pull request.
            outcome=noted
            body="Claude reviewed $short at **$LEVEL**."
            if [ -n "$elsewhere" ]; then
              body=$(printf '%s These findings are about lines outside the change, so they are here rather than on the lines:\n\n%s' "$body" "$elsewhere")
            fi
            if [ -n "$unposted" ]; then
              body=$(printf '%s\n\nGitHub didn'"'"'t take these as comments on the change ([the run](%s) says why), so they are here instead:\n\n%s' "$body" "$RUN_URL" "$unposted")
            fi
            body=$(printf '%s\n\nAnything else it found is in comments on the lines. Once these are dealt with, comment `/claude-review` for another review, or, where one doesn'"'"'t apply, add the `no-claude-review` label, which passes the "Claude reviewed" status (and skips the reviews CI starts).' "$body")
          elif [ "$RESULT" = success ] && [ "$OUTCOME" = success ] && [ "$POSTED" = true ]; then
            outcome=reviewed
            body="Claude reviewed $short at **$LEVEL**. What it found is in comments on the lines; none means it found nothing to raise."
          elif [ "$RESULT" = success ] && [ "$OUTCOME" = success ]; then
            outcome=failed
            body="Claude reviewed $short at **$LEVEL** but didn't say what it found in a form that could be posted ([the run]($RUN_URL)). Comment \`/claude-review\` to try again."
          elif [ "$RESULT" = cancelled ] && [ "$REPLACED" = true ]; then
            # The status passes over this comment, so the newer review's says how the pull request stands.
            outcome=replaced
            body="This request for Claude's review of $short at **$LEVEL** was dropped while it waited, since GitHub keeps only the newest of the reviews waiting for one that's running ([the run]($RUN_URL)). Comment \`/claude-review $LEVEL\` to ask for it again."
          elif [ "$RESULT" = cancelled ]; then
            outcome=failed
            body="Claude's review of $short at **$LEVEL** didn't finish ([the run]($RUN_URL)). Comment \`/claude-review\` to try again."
          else
            outcome=failed
            body="Claude couldn't review $short at **$LEVEL** ([the run]($RUN_URL) says why). Comment \`/claude-review\` to try again."
          fi
          body=$(printf '<!-- claude-review sha=%s outcome=%s -->\n%s\n\nUsage: %s\n' "$SHA" "$outcome" "$body" "${USAGE:-Claude Code reported no usage.}")
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          # GitHub refuses a comment longer than 65,536 characters, which would leave this one saying "reviewing", so a
          # longer one is cut short, keeping its first line, and the run's summary above keeps all of it.
          if [ "${#body}" -gt 60000 ]; then
            body=$(printf '%s\n\n… cut short, since GitHub limits how long a comment can be; [the run](%s)'"'"'s summary has all of it.' "${body:0:60000}" "$RUN_URL")
          fi
          gh api --method PATCH "repos/$GH_REPO/issues/comments/$COMMENT" -f body="$body" > /dev/null

      # The status follows the comment just written; a run started by this job's token is the one kind GitHub allows.
      - name: Refresh the status
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run review-status.yml --ref "$DEFAULT_BRANCH"
