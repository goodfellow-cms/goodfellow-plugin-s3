# Temporary: says whether CLAUDE_CODE_OAUTH_TOKEN reaches a run on a push to this branch, and nothing else about it.
name: Secret check
on:
  push:
    branches: [claude/secret-check]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Say whether the secrets are set
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_GITHUB: ${{ secrets.GITHUB_TOKEN != '' }}
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN is set: $HAS_CLAUDE"
          echo "GITHUB_TOKEN is set (for comparison): $HAS_GITHUB"
