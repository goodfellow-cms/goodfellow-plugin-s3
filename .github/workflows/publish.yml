# Stages a release on npm, with npm's provenance, when a version's tag, such as
# v1.2.3, is pushed. A maintainer then approves it on npm, which publishes it, so
# nothing reaches npm without their two-factor authentication. Provenance lets
# Goodfellow's Plugins screen say which repository it was built from. npm's
# trusted publishing lets this workflow stage it without a token: set it up once,
# for staged publishing only, as the README says.
name: Publish

on:
  push:
    tags: ["v*"]
  # For a tag whose push didn't start it: choose the tag under "Use workflow from".
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to check the tag is on main.
          fetch-depth: 0
      - name: Check the tag is a version's, on main
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Run this for the tag v$version, not $GITHUB_REF_NAME."
            exit 1
          fi
          # Only what was merged into main is released, never a tag on a branch nobody reviewed.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag a commit on main."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The manifest the build writes must be the one committed, which Goodfellow's Plugins screen reads.
      - run: npm run build
      - run: git diff --exit-code goodfellow-plugin.json
      # What's staged is what was just built from this commit: `.npmrc`'s `ignore-scripts` keeps npm from running
      # any script of the package's own while packing.
      # Staged publishing needs npm 11.15.0 or later. An exact release, checked against its digest, so what publishes
      # doesn't change by itself; Dependabot can't see it here, so move it on by hand.
      - name: Install npm 11.21.0, checked against the digest npm published for it
        env:
          NPM_RELEASE: 11.21.0
          # `npm view npm@<release> dist.integrity`: move both on together.
          NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
        run: |
          tarball=$(npm pack "npm@$NPM_RELEASE" --pack-destination "$RUNNER_TEMP" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          digest="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$tarball" | base64 -w0)"
          if [ "$digest" != "$NPM_INTEGRITY" ]; then
            echo "::error::npm $NPM_RELEASE from the registry isn't the release this workflow was written for."
            exit 1
          fi
          npm install --global "$RUNNER_TEMP/$tarball"
      # The release is staged, not published: nobody can install it until a maintainer approves it on npm with
      # two-factor authentication. It's packed once, and the digest this run lists is that file's, for the maintainer to
      # compare before approving.
      - name: Stage the release on npm
        run: |
          name=$(node -p 'require("./package.json").name')
          tarball=$(npm pack --json --pack-destination "$RUNNER_TEMP" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          digest="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$tarball" | base64 -w0)"
          {
            echo "Staging \`$tarball\` for approval: \`$digest\`"
            echo
            echo "Approve it from your computer: \`npm stage list $name\`, compare the digest, then \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
          npm stage publish "$RUNNER_TEMP/$tarball" --provenance --access public
